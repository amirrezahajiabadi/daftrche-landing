# Nginx configuration for Clean URLs (daftrche.ir)
server {
    listen 80;
    listen [::]:80;
    server_name daftrche.ir www.daftrche.ir;

    root /var/www/daftrche;
    index index.html;

    # 302 Temporary Redirect for temporarily removed collaborate page
    location ~ ^/contribute(/|\.html)?$ {
        return 302 /;
    }

    # 301 Redirect old APK name to official APK
    location = /downloads/app-release.apk {
        return 301 /downloads/daftarche.apk;
    }

    # Block direct access to backup and temporary files
    location ~* \.(bak|tmp|swp|orig)$ {
        deny all;
        return 404;
    }

    # 301 Redirect /index.html to root
    location = /index.html {
        return 301 /;
    }

    # 301 Redirect direct *.html requests to clean URLs (exclude 404.html)
    location = /404.html {
        # keep accessible for error page routing
    }

    location ~ ^/(?<cleanpath>.+)\.html$ {
        return 301 /$cleanpath;
    }

    # Clean URLs internal routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom 404 error page
    error_page 404 /404.html;
}

